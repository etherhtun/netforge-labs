name: ipv6-lab

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    arista_ceos:
      image: ceos:4.32.0F
      exec:
        - /sbin/sysctl -w net.ipv4.ip_forward=1
        - /sbin/sysctl -w net.ipv6.conf.all.forwarding=1
  nodes:
    r1-v6:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.71
    r2-v6:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.72
    leaf1-v6:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.73
    leaf2-v6:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.74

  links:
    - endpoints: ["r1-v6:eth1", "leaf1-v6:eth1"]
    - endpoints: ["r1-v6:eth2", "leaf2-v6:eth1"]
    - endpoints: ["r2-v6:eth1", "leaf1-v6:eth2"]
    - endpoints: ["r2-v6:eth2", "leaf2-v6:eth2"]
