configure
hostname spine2
!
service routing protocols model multi-agent
!
ip access-list ACL-COPP-BGP
   10 permit tcp any any eq bgp
   20 permit tcp any eq bgp any
!
class-map type copp CLASS-COPP-BGP
   match ip access-list ACL-COPP-BGP
!
policy-map type copp POLICY-COPP
   class CLASS-COPP-BGP
      police rate 1000 pps
!
control-plane
   service-policy input POLICY-COPP
!
interface Loopback0
   ip address 10.255.0.2/32
   ip ospf area 0.0.0.0
!
interface Ethernet1
   no switchport
   ip address 10.0.2.1/30
   ip ospf area 0.0.0.0
!
interface Ethernet2
   no switchport
   ip address 10.0.2.5/30
   ip ospf area 0.0.0.0
!
router ospf 100
   router-id 10.255.0.2
   passive-interface Loopback0
