configure
hostname pe2
!
router isis CORE
   net 49.0001.0000.0000.0005.00
   is-type level-2
   metric-style wide
   segment-routing mpls
      no shutdown
      prefix-segment 10.255.0.5/32 index 105
!
interface Loopback0
   ip address 10.255.0.5/32
   isis enable CORE
!
interface Ethernet1
   no switchport
   ip address 10.0.2.2/30
   isis enable CORE
   isis metric 10
!
interface Ethernet2
   no switchport
   ip address 10.0.5.2/30
   isis enable CORE
   isis metric 10
