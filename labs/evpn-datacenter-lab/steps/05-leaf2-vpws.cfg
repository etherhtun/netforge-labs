configure
patch panel
   patch VPWS-CUSTOMER-A
      connector-a Ethernet3
      connector-b BGP VPWS 100 pseudo-circuit 1
!
router bgp 65000
   vpws VPWS-CUSTOMER-A
      rd 10.255.0.12:100
      route-target import 100:100
      route-target export 100:100
      local-vpws-id 102
      remote-vpws-id 101
