enable
configure
vrf instance RED
   rd 65000:100
!
ip routing vrf RED
!
interface Ethernet2
   no switchport
   vrf RED
   ip address 10.0.11.1/24
!
router bgp 65000
   vrf RED
      rd 65000:100
      route-target import evpn 65000:100
      route-target export evpn 65000:100
      route-target import vpn4 65000:100
      route-target export vpn4 65000:100
!
end
