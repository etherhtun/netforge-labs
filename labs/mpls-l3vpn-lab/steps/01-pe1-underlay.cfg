enable
configure
hostname pe1
!
ip routing
!
interface Loopback0
   ip address 2.2.2.2/32
!
interface Ethernet1
   no switchport
   ip address 10.1.1.2/24
   mpls ip
!
router ospf 1
   router-id 2.2.2.2
   network 2.2.2.2/32 area 0
   network 10.1.1.0/24 area 0
!
mpls ip
!
mpls ldp
   router-id 2.2.2.2
   transport-address interface Loopback0
   interface Ethernet1
   no shutdown
!
end
