enable
configure
hostname p1
!
ip routing
!
interface Loopback0
   ip address 1.1.1.1/32
!
interface Ethernet1
   no switchport
   ip address 10.1.1.1/24
   mpls ip
!
interface Ethernet2
   no switchport
   ip address 10.1.2.1/24
   mpls ip
!
router ospf 1
   router-id 1.1.1.1
   network 1.1.1.1/32 area 0
   network 10.1.1.0/24 area 0
   network 10.1.2.0/24 area 0
!
mpls ip
!
mpls ldp
   router-id 1.1.1.1
   transport-address interface Loopback0
   interface Ethernet1
   interface Ethernet2
   no shutdown
!
end
