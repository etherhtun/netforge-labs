enable
configure
hostname pe2
!
ip routing
!
interface Loopback0
   ip address 3.3.3.3/32
!
interface Ethernet1
   no switchport
   ip address 10.1.2.2/24
   mpls ip
!
router ospf 1
   router-id 3.3.3.3
   network 3.3.3.3/32 area 0
   network 10.1.2.0/24 area 0
!
mpls ip
!
mpls ldp
   router-id 3.3.3.3
   transport-address interface Loopback0
   interface Ethernet1
   no shutdown
!
end
