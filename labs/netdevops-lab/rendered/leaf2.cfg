configure
hostname leaf2
!
service routing protocols model multi-agent
!
interface Loopback0
   ip address 10.255.0.12/32
   ip ospf area 0.0.0.0
!
interface Loopback1
   ip address 10.255.1.12/32
   ip ospf area 0.0.0.0
!
interface Ethernet1
   no switchport
   ip address 10.0.1.6/30
   ip ospf area 0.0.0.0
!
interface Ethernet2
   no switchport
   ip address 10.0.2.6/30
   ip ospf area 0.0.0.0
!
router ospf 100
   router-id 10.255.0.12
   passive-interface Loopback0
   passive-interface Loopback1
!
router bgp 65000
   router-id 10.255.0.12
   neighbor SPINES-EVPN peer group
   neighbor SPINES-EVPN remote-as 65000
   neighbor SPINES-EVPN update-source Loopback0
   neighbor 10.255.0.1 peer group SPINES-EVPN
   neighbor 10.255.0.2 peer group SPINES-EVPN
   !
   address-family evpn
      neighbor SPINES-EVPN activate