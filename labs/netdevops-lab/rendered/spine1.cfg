configure
hostname spine1
!
interface Loopback0
   ip address 10.255.0.1/32
   ip ospf area 0.0.0.0
!
interface Ethernet1
   no switchport
   ip address 10.0.1.1/30
   ip ospf area 0.0.0.0
!
interface Ethernet2
   no switchport
   ip address 10.0.1.5/30
   ip ospf area 0.0.0.0
!
router ospf 100
   router-id 10.255.0.1
   passive-interface Loopback0
!
router bgp 65000
   router-id 10.255.0.1
   neighbor LEAFS-EVPN peer group
   neighbor LEAFS-EVPN remote-as 65000
   neighbor LEAFS-EVPN update-source Loopback0
   neighbor LEAFS-EVPN route-reflector-client
   neighbor 10.255.0.11 peer group LEAFS-EVPN
   neighbor 10.255.0.12 peer group LEAFS-EVPN
   !
   address-family evpn
      neighbor LEAFS-EVPN activate