! Step 04 demonstrates the next-hop trap, so it must ENSURE the trap is present.
! On a first run this is a no-op. On a re-run it undoes step 05, which is what
! makes ./run.sh --all repeatable on a fabric in any state.
configure
router bgp 65001
 address-family ipv4
  no neighbor 2.2.2.2 next-hop-self
!
end
