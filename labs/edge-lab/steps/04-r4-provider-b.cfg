configure
ip routing
service routing protocols model multi-agent
!
interface Loopback0
 ip address 4.4.4.4/32
!
interface Ethernet1
 no switchport
 ip address 10.0.24.4/24
!
! Peering link to the other provider
interface Ethernet2
 no switchport
 ip address 10.0.34.4/24
!
interface Ethernet3
 no switchport
 ip address 172.16.40.1/24
!
router bgp 65003
 router-id 4.4.4.4
 no bgp default ipv4-unicast
 neighbor 10.0.24.2 remote-as 65001
 neighbor 10.0.34.3 remote-as 65002
 address-family ipv4
  neighbor 10.0.24.2 activate
  neighbor 10.0.34.3 activate
  network 172.16.40.0/24
!
end
