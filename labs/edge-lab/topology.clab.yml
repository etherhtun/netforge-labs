name: edge-lab

topology:
  nodes:
    r1:  { kind: arista_ceos, image: ceos:4.32.0F }
    r2:  { kind: arista_ceos, image: ceos:4.32.0F }
    r3:  { kind: arista_ceos, image: ceos:4.32.0F }
    sw1: { kind: arista_ceos, image: ceos:4.32.0F }

    # NOTE: host addressing goes in exec, NOT cmd. cmd runs before containerlab
    # has wired eth1, so configuring it there crash-loops the container.
    host1:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        # containerlab already owns the default route (management), so add a
        # specific route to the far-side network rather than replacing it.
        - ip route add 172.16.30.0/24 via 192.168.10.1

    host2:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 172.16.30.10/24 dev eth1
        - ip route add 192.168.10.0/24 via 172.16.30.1

  # endpoints MUST be lowercase ethN — cEOS entrypoint counts eth* interfaces
  links:
    - endpoints: ["r1:eth1",  "r2:eth1"]    # 10.0.12.0/24  OSPF + iBGP
    - endpoints: ["r1:eth2",  "r3:eth1"]    # 10.0.13.0/24  eBGP link A
    - endpoints: ["r2:eth2",  "r3:eth2"]    # 10.0.23.0/24  eBGP link B
    - endpoints: ["r1:eth3",  "sw1:eth1"]   # VLAN 10
    - endpoints: ["r2:eth3",  "sw1:eth2"]   # VLAN 10
    - endpoints: ["sw1:eth3", "host1:eth1"] # access port
    - endpoints: ["r3:eth3",  "host2:eth1"] # remote host
