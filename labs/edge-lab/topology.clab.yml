name: edge-lab

topology:
  nodes:
    r1:  { kind: arista_ceos, image: ceos:4.32.0F }   # AS 65001 edge -> provider A
    r2:  { kind: arista_ceos, image: ceos:4.32.0F }   # AS 65001 edge -> provider B
    r3:  { kind: arista_ceos, image: ceos:4.32.0F }   # AS 65002  provider A
    r4:  { kind: arista_ceos, image: ceos:4.32.0F }   # AS 65003  provider B
    sw1: { kind: arista_ceos, image: ceos:4.32.0F }   # L2 access

    # Host addressing goes in exec, NOT cmd: cmd runs before containerlab has
    # wired eth1, which crash-loops the container.
    host1:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        # containerlab owns the default route (management), so add specific ones.
        - ip route add 172.16.30.0/24 via 192.168.10.1
        - ip route add 172.16.40.0/24 via 192.168.10.1

    host2:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 172.16.30.10/24 dev eth1
        - ip route add 192.168.10.0/24 via 172.16.30.1

    host3:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 172.16.40.10/24 dev eth1
        - ip route add 192.168.10.0/24 via 172.16.40.1

  # endpoints MUST be lowercase ethN — cEOS entrypoint counts eth* interfaces
  links:
    - endpoints: ["r1:eth1",  "r2:eth1"]    # 10.0.12.0/24  OSPF + iBGP
    - endpoints: ["r1:eth2",  "r3:eth1"]    # 10.0.13.0/24  eBGP -> provider A
    - endpoints: ["r2:eth2",  "r4:eth1"]    # 10.0.24.0/24  eBGP -> provider B
    - endpoints: ["r3:eth2",  "r4:eth2"]    # 10.0.34.0/24  provider peering
    - endpoints: ["r1:eth3",  "sw1:eth1"]   # VLAN 10
    - endpoints: ["r2:eth3",  "sw1:eth2"]   # VLAN 10
    - endpoints: ["sw1:eth3", "host1:eth1"]
    - endpoints: ["r3:eth3",  "host2:eth1"]
    - endpoints: ["r4:eth3",  "host3:eth1"]
