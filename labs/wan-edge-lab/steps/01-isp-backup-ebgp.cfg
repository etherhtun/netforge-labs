configure
hostname isp-backup
!
service routing protocols model multi-agent
!
interface Loopback0
   ip address 2.2.2.2/32
!
interface Ethernet1
   no switchport
   ip address 203.0.113.2/30
!
interface Ethernet2
   no switchport
   ip address 192.0.2.2/30
!
router bgp 65200
   router-id 2.2.2.2
   neighbor 203.0.113.1 remote-as 65000
   neighbor 192.0.2.1 remote-as 65100
   network 2.2.2.2/32
