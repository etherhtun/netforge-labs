name: wan-edge-lab

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    arista_ceos:
      image: ceos:4.32.0F
      exec:
        - /sbin/sysctl -w net.ipv4.ip_forward=1
  nodes:
    wan-edge1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.51
    wan-edge2:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.52
    isp-primary:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.53
    isp-backup:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.54

  links:
    - endpoints: ["wan-edge1:eth1", "isp-primary:eth1"]
    - endpoints: ["wan-edge1:eth2", "wan-edge2:eth1"]
    - endpoints: ["wan-edge2:eth2", "isp-backup:eth1"]
    - endpoints: ["isp-primary:eth2", "isp-backup:eth2"]
