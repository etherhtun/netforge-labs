site_name: NetForge Labs
site_description: Learn networking by building it — hands-on, lab-driven courses. Course 1 - VXLAN-EVPN on Juniper.
site_author: etherhtun

theme:
  name: material
  icon:
    logo: material/lan-connect
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Roadmap: roadmap.md

  - Get Started:
    - getting-started/index.md
    - Lab setup on macOS: getting-started/lab-setup-macos.md
    - Docker & containerlab: getting-started/containerlab.md
    - Cloud VM (optional): getting-started/cloud-vm.md
    - Team quickstart: getting-started/team-quickstart.md
    - How the lab works: getting-started/how-the-lab-works.md
    - Lab troubleshooting: getting-started/lab-troubleshooting.md

  - Courses:
    - courses/index.md
    - "Foundations · Linux & Physical Infrastructure":
      - courses/linux-foundations/index.md
      - 1 · Shell fluency: courses/linux-foundations/01-shell.md
      - 2 · Parsing device output: courses/linux-foundations/02-text-processing.md
      - 3 · SSH properly: courses/linux-foundations/03-ssh.md
      - 4 · Processes, services and logs: courses/linux-foundations/04-services.md
      - 5 · Git for network engineers: courses/linux-foundations/05-git.md
      - 6 · Kernel networking & packet diagnostics: courses/linux-foundations/06-kernel-networking.md
      - 7 · Layer 1 optics & physical infrastructure: courses/linux-foundations/07-physical-layer.md
      - Interview questions: courses/linux-foundations/interview-questions.md
    - "Phase 0 · IGP Fundamentals":
      - courses/00-igp-fundamentals/index.md
      - 1 · How link-state routing works: courses/00-igp-fundamentals/01-link-state.md
      - 2 · OSPF: courses/00-igp-fundamentals/02-ospf.md
      - 3 · IS-IS: courses/00-igp-fundamentals/03-isis.md
      - 4 · Choosing between them: courses/00-igp-fundamentals/04-choosing.md
      - 5 · IGPs at Hyper-Scale: courses/00-igp-fundamentals/05-at-scale.md
      - Interview questions: courses/00-igp-fundamentals/interview-questions.md
    - "Phase 1 · BGP Fundamentals":
      - courses/01-bgp/index.md
      - "🧪 Lab 01 · eBGP, iBGP & next-hop-self": courses/01-bgp/lab-01-ebgp-ibgp.md
      - "🧪 Lab 02 · iBGP over IS-IS": courses/01-bgp/lab-02-isis-underlay.md
      - "🧪 Lab 03 · Route reflectors": courses/01-bgp/lab-03-route-reflectors.md
      - "🧪 Lab 04 · Multihomed edge": courses/01-bgp/lab-04-dual-homed-edge.md
      - Concepts:
        - courses/01-bgp/concepts/index.md
        - 1 · How BGP works: courses/01-bgp/concepts/01-how-bgp-works.md
        - 2 · Path attributes: courses/01-bgp/concepts/02-attributes.md
        - 3 · Best-path selection: courses/01-bgp/concepts/03-path-selection.md
        - 4 · Policy and filtering: courses/01-bgp/concepts/04-policy.md
        - 5 · Scaling iBGP: courses/01-bgp/concepts/05-scaling.md
        - Interview questions: courses/01-bgp/concepts/interview-questions.md
    - "Phase 2 · BGP-DIA & Internet Edge":
      - courses/02-bgp-dia/index.md
      - "🧪 Lab 01 · Multi-Provider DIA & Traffic Engineering": courses/02-bgp-dia/lab-01-dia-multihoming.md
      - "🧪 Lab 02 · RPKI ROV & Bogon Security": courses/02-bgp-dia/lab-02-rpki-security.md
      - "🧪 Lab 03 · IXP Peering & Sub-Second BFD": courses/02-bgp-dia/lab-03-ixp-peering.md
      - "🧪 Lab 04 · CGNAT & Provider Edge Services": courses/02-bgp-dia/lab-04-cgnat-services.md
      - Interview questions: courses/02-bgp-dia/interview-questions.md
    - "Phase 3 · MPLS & L3VPN":
      - courses/03-mpls-l3vpn/index.md
      - "🧪 Lab 01 · MPLS + LDP Underlay": courses/03-mpls-l3vpn/lab-01-mpls-ldp.md
      - "🧪 Lab 02 · Single-AS L3VPN & VRF Isolation": courses/03-mpls-l3vpn/lab-02-l3vpn-option-a.md
      - "🧪 Lab 03 · Inter-AS L3VPN Option B": courses/03-mpls-l3vpn/lab-03-l3vpn-option-b.md
      - "🧪 Lab 04 · Inter-AS L3VPN Option C": courses/03-mpls-l3vpn/lab-04-l3vpn-option-c.md
      - Interview questions: courses/03-mpls-l3vpn/interview-questions.md
    - "Phase 3.5 · Segment Routing":
      - courses/035-segment-routing/index.md
    - "Phase 4 · EVPN Services":
      - courses/04-evpn/index.md
      - "🧪 Lab 01 · VXLAN-EVPN on cEOS": courses/04-evpn/lab-01-vxlan-evpn.md
      - Concepts:
        - courses/04-evpn/concepts/index.md
        - 1 · Why VXLAN-EVPN?: courses/04-evpn/concepts/01-why-vxlan-evpn.md
        - 2 · Underlay vs overlay: courses/04-evpn/concepts/02-underlay-overlay.md
        - 3 · VXLAN data plane: courses/04-evpn/concepts/03-vxlan-dataplane.md
        - 4 · EVPN control plane: courses/04-evpn/concepts/04-evpn-controlplane.md
        - 5 · Route types: courses/04-evpn/concepts/05-route-types.md
        - 6 · Packet walk: courses/04-evpn/concepts/06-packet-walk.md
        - Interview questions: courses/04-evpn/concepts/interview-questions.md
    - "Phase 5 · NetDevOps":
      - courses/05-netdevops/index.md
    - "Phase 6 · Hybrid Cloud & Edge":
      - courses/06-hybrid-cloud/index.md
    - "Phase 7 · Telemetry & Observability":
      - courses/07-telemetry/index.md

  - Archive:
    - archive/index.md
    - "Juniper VXLAN-EVPN": archive/juniper-vxlan-evpn/index.md
    - 1 · Underlay (OSPF): archive/juniper-vxlan-evpn/01-underlay.md
    - 2 · Overlay (iBGP-EVPN + RR): archive/juniper-vxlan-evpn/02-overlay-rr.md
    - 3 · L2VNI (stretch a VLAN): archive/juniper-vxlan-evpn/03-l2vni.md
    - 4 · L3VNI & anycast gateway: archive/juniper-vxlan-evpn/04-l3vni-anycast.md
    - 5 · Multi-tenancy: archive/juniper-vxlan-evpn/05-multitenancy.md
    - 6 · ESI multihoming: archive/juniper-vxlan-evpn/06-esi-multihoming.md
    - 7 · eBGP designs: archive/juniper-vxlan-evpn/07-ebgp.md
    - 8 · External connectivity (L3 out): archive/juniper-vxlan-evpn/08-l3out.md
    - 9 · Multi-site / DCI: archive/juniper-vxlan-evpn/09-multisite.md
    - 10 · Production hardening: archive/juniper-vxlan-evpn/10-production-hardening.md
    - Labs:
      - All labs (overview): archive/juniper-vxlan-evpn/labs/index.md
      - "🧪 Lab 01 · Full mesh": archive/juniper-vxlan-evpn/labs/lab-01-fullmesh.md
      - "🧪 Lab 02 · Route reflectors": archive/juniper-vxlan-evpn/labs/lab-02-rr.md
      - "🧪 Lab 03 · L3VNI + anycast GW": archive/juniper-vxlan-evpn/labs/lab-03-l3vni.md
      - "🧪 Lab 04 · Multi-tenancy": archive/juniper-vxlan-evpn/labs/lab-04-multitenancy.md
      - "🧪 Lab 05 · ESI multihoming": archive/juniper-vxlan-evpn/labs/lab-05-esi.md

  - Reference:
    - reference/index.md
    - IP addressing plan: reference/ipplan.md
    - Verification cheatsheet: reference/verify-cheatsheet.md
    - Validation runbook (drafts): reference/validation-runbook.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - codehilite
  - pymdownx.arithmatex
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - tables
  - toc:
      permalink: true
